  <circle cx="1388" cy="155" r="9" fill="none" stroke="#50575e" stroke-width="2.5"/>
  <path d="M1395 162 l7 7" stroke="#50575e" stroke-width="2.5" stroke-linecap="round"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#1d2327">
