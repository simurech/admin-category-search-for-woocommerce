  <text x="96" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" opacity="0.85">Find any category or brand in seconds —</text>
  <text x="96" y="388" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" opacity="0.85">in the product editor, Quick Edit and Bulk Edit.</text>

