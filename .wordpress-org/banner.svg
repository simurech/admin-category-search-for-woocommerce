      <stop offset="0" stop-color="#2c7fc4"/>
      <stop offset="1" stop-color="#174e7c"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b2740" flood-opacity="0.35"/>
