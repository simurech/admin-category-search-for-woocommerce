name: Auto Release

on:
  push:
    branches:
      - main

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version aus Plugin-Header lesen
        id: version
        run: |
          VERSION=$(grep -m1 '^ \* Version:' admin-category-search-for-woocommerce.php | sed 's/.*Version: *//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Prüfen ob Tag bereits existiert
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Distributions-ZIP bauen
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          mkdir -p dist
          git archive --format=zip \
            --prefix=admin-category-search-for-woocommerce/ \
            -o "dist/admin-category-search-for-woocommerce-${{ steps.version.outputs.version }}.zip" \
            HEAD -- \
            admin-category-search-for-woocommerce.php \
            includes \
            assets \
            readme.txt

      - name: Release-Notizen aus readme.txt-Changelog lesen
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            $0 == "= " ver " =" { found = 1; next }
            found && /^= .* =$/ { exit }
            found && /^== / { exit }
            found { print }
          ' readme.txt | sed '/^[[:space:]]*$/d' > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "Version ${{ steps.version.outputs.version }}" > dist/release-notes.md
          fi
          cat dist/release-notes.md

      - name: Release erstellen
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/admin-category-search-for-woocommerce-${{ steps.version.outputs.version }}.zip" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file dist/release-notes.md \
            --latest
