name: Plugin Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: plugin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          slug: admin-category-search-for-woocommerce
          exclude-directories: '.wordpress-org'
